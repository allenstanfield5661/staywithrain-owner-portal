# Netlify detects Next.js and applies its OpenNext adapter.
# Do not set a publish directory. That skips the adapter.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Set DATA_MODE, Hostaway keys, SESSION_SECRET, and admin/owner config
  # in the Netlify UI. See DEPLOY.md. Do not put secrets in this file.
